name: CI — Resala Chat

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts', 'settings.gradle.kts') }}

      - name: Decode debug keystore (if provided)
        if: env.DEBUG_KEYSTORE_B64 != ''
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: echo "$DEBUG_KEYSTORE_B64" | base64 -d > debug.keystore || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || echo "no gradlew, will use gradle"

      - name: Assemble Debug
        run: |
          if [ -f ./gradlew ]; then ./gradlew :app:assembleDebug --stacktrace
          else gradle :app:assembleDebug --stacktrace; fi
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Unit tests (Robolectric + Room + Paging)
        run: |
          if [ -f ./gradlew ]; then ./gradlew :app:testDebugUnitTest --stacktrace --info
          else gradle :app:testDebugUnitTest --stacktrace; fi

      - name: Roborazzi screenshots (light/dark/RTL)
        run: |
          if [ -f ./gradlew ]; then ./gradlew :app:recordRoborazziDebug --stacktrace || ./gradlew :app:verifyRoborazziDebug --stacktrace
          else gradle :app:recordRoborazziDebug || gradle :app:verifyRoborazziDebug; fi
        continue-on-error: true

      - name: Lint
        run: |
          if [ -f ./gradlew ]; then ./gradlew :app:lintDebug --stacktrace
          else gradle :app:lintDebug --stacktrace; fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/outputs/screenshots/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
